apiVersion: netbird.io/v1alpha1
kind: SidecarProfile
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: example-sidecar
  namespace: syn-netbird-operator
spec:
  injectionMode: Sidecar
  podSelector:
    matchLabels:
      netbird: enabled
  setupKeyRef:
    name: example-setup-key
