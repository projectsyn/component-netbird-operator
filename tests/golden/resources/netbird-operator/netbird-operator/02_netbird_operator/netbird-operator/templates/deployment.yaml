apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/instance: netbird-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: netbird-operator
    app.kubernetes.io/version: v0.6.0
    helm.sh/chart: netbird-operator-0.6.0
  name: netbird-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: netbird-operator
      app.kubernetes.io/name: netbird-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: operator
        app.kubernetes.io/instance: netbird-operator
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: netbird-operator
        app.kubernetes.io/version: v0.6.0
        helm.sh/chart: netbird-operator-0.6.0
    spec:
      containers:
        - args:
            - --metrics-bind-address=:8080
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
            - --runtime-namespace=$(POD_NAMESPACE)
            - --cluster-name=kubernetes
            - --cluster-dns=svc.cluster.local
            - --netbird-api-key=$(NB_API_KEY)
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NB_API_KEY
              valueFrom:
                secretKeyRef:
                  key: NB_API_KEY
                  name: netbird-mgmt-api-key
          image: ghcr.io/netbirdio/netbird-operator:v0.6.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 1
          name: netbird-operator
          ports:
            - containerPort: 443
              name: webhook-server
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-certs
              readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: netbird-operator
      volumes:
        - name: webhook-certs
          secret:
            defaultMode: 420
            secretName: netbird-operator-tls
